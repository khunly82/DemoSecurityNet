name: Cicd
on:
  push:
    branches: [main]

jobs:
  sonar:
    runs-on: ubuntu-latest
    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"

    env:
      SONAR_URL: http://localhost:9000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Attendre que SonarQube soit prêt
        run: |
          for i in $(seq 1 60); do
            if curl -s "$SONAR_URL/api/system/status" | grep -q '"status":"UP"'; then
              echo "SonarQube est UP"; exit 0
            fi
            echo "En attente... ($i)"; sleep 5
          done
          echo "SonarQube n'a pas démarré"; exit 1

      - name: Generate SonarQube Token via API
        run: |
            set -o pipefail
            NEW_PWD='NewSecurePassword123!'

            curl -sf -u admin:admin -X POST \
                "$SONAR_URL/api/users/change_password" \
                --data-urlencode "login=admin" \
                --data-urlencode "previousPassword=admin" \
                --data-urlencode "password=$NEW_PWD"

            RESPONSE=$(curl -s -w '\n%{http_code}' -u "admin:$NEW_PWD" -X POST \
                "$SONAR_URL/api/user_tokens/generate" \
                --data-urlencode "name=github-actions-token" \
                --data-urlencode "type=GLOBAL_ANALYSIS_TOKEN")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')

            if [ "$HTTP_CODE" != "200" ]; then
                echo "Échec de génération du token (HTTP $HTTP_CODE) : $BODY"; exit 1
            fi

            TOKEN=$(echo "$BODY" | jq -r '.token')
            echo "::add-mask::$TOKEN"
            echo "SONAR_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install SonarScanner for .NET
        run: |
          dotnet tool install --global dotnet-sonarscanner
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Begin SonarQube analysis
        run: |
          dotnet-sonarscanner begin \
            /k:"DemoSecurity" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="$SONAR_URL"

      - name: Restore NuGet
        run: dotnet restore

      - name: Build application
        run: dotnet build --configuration Release --no-restore

      - name: End SonarQube analysis
        run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"